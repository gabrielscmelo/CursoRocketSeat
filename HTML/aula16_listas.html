<h1>Bolo de Cenoura</h1>
<h2>Ingredientes</h2>
<ul>
    <li>Farinha 1kg</li>
    <li>Cacau em pó 100g</li>
    <li>1 cenoura ralada</li>
</ul>

<h2>Modo de Preparo</h2>
<ol>
    <li>Pegar a Farinha e colocar em um
        recipiente</li>
    <li>Misturar com Cacau</li>
    <li>Colocar na forma</li>
</ol>
